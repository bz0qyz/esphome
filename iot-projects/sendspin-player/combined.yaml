# Set network performance to false if there ring buffer issue
network:
  enable_high_performance: false


http_request:
  id: http_req

output:
  - platform: ledc
    pin: ${SPI_BL}
    id: backlight_pwm
    frequency: 2000 Hz
light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: display_backlight
    icon: "mdi:television-ambient-light"
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s

i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: ${PIN_LRCLK}
    i2s_bclk_pin: ${PIN_BCLK}

speaker:
  - platform: i2s_audio
    id: i2s_audio_speaker
    dac_type: external
    i2s_audio_id: i2s_out
    i2s_dout_pin: ${PIN_DOUT}
    channel: stereo
    sample_rate: ${sample_rate}
    bits_per_sample: 32bit
    timeout: never
    buffer_duration: 500ms

  - platform: mixer
    id: mixer_speaker_id
    output_speaker: i2s_audio_speaker
    source_speakers:
      - id: media_spk_mixer_input
        buffer_duration: 300ms
        timeout: never
      - id: announcement_spk_mixer_input
        buffer_duration: 300ms
        timeout: never
    num_channels: 2
    task_stack_in_psram: false

  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_spk_mixer_input
    sample_rate: $sample_rate
    bits_per_sample: 16
    buffer_duration: 300ms
    task_stack_in_psram: false
  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_spk_mixer_input
    sample_rate: $sample_rate
    bits_per_sample: 16
    buffer_duration: 300ms
    task_stack_in_psram: false

sendspin:
  id: sendspin_module
  task_stack_in_psram: false

media_source:
  - platform: audio_http
    id: http_announcement_source
    buffer_size: 250000
    task_stack_in_psram: false
  - platform: audio_http
    id: http_media_source
    buffer_size: 500000
    task_stack_in_psram: false
  - platform: sendspin
    id: sendspin_media_source
    initial_static_delay: 0ms
    static_delay_adjustable: true
    sample_rate: $sample_rate
    buffer_size: 250000
    task_stack_in_psram: false
    decode_memory: internal #psram


media_player:
  - platform: sendspin
    id: sendspin_group_media_player
  - platform: speaker_source
    name: "Media Player"
    id: external_media_player
    internal: false
    media_pipeline:
        speaker: media_resampling_speaker
        format: FLAC
        sample_rate: $sample_rate
        num_channels: 2
        sources:
          - http_media_source
          - sendspin_media_source
    announcement_pipeline:
        speaker: announcement_resampling_speaker
        #speaker: i2s_audio_speaker
        format: FLAC
        sample_rate: $sample_rate
        num_channels: 1
        sources:
          - http_announcement_source
    volume_increment: 0.02
    volume_initial: 0.80
    volume_min: 0.04
    volume_max: 0.96
    on_announcement:
      - mixer_speaker.apply_ducking:
          id: media_spk_mixer_input
          decibel_reduction: 40
          duration: 0.2s
    on_turn_off:
      then:
        - logger.log:
            format: "Media player has been powered off"
            level: WARN
    on_turn_on:
      then:
        - logger.log:
            format: "Media player has been powered on"
            level: WARN
    on_mute:
      then:
        - logger.log:
            format: "Media player has been muted"
            level: WARN
    on_unmute:
      then:
        - logger.log:
            format: "Media player has been un-muted"
            level: WARN
    
    on_state:
      - if:
          condition:
            not:
              media_player.is_announcing: external_media_player
          then:
            - mixer_speaker.apply_ducking:
                id: media_spk_mixer_input
                decibel_reduction: 0
                duration: 1.0s    

spi:
  clk_pin: ${SPI_CLK}
  mosi_pin: ${SPI_MOSI}

# Fonts
font:
  - file: "gfonts://Roboto"
    id: title_font
    size: 20

  - file: "gfonts://Roboto"
    id: artist_font
    size: 15

  - file: "gfonts://Roboto"
    id: small_font
    size: 12

# Display
display:
  - platform: mipi_spi
    model: ST7789V
    id: music_display
    data_rate: 20MHz
    dimensions:
      width: 240
      height: 320
    dc_pin: ${SPI_DC}
    cs_pin: ${SPI_CS}
    reset_pin: ${SPI_RST}
    rotation: 270
    color_order: bgr
    invert_colors: true
    update_interval: never
    auto_clear_enabled: true
    lambda: |-
      // Right-side metadata
      if (id(track_title).has_state()) {
        it.fill(Color(12, 12, 16));
  
        // Album art: left side, 220 x 220
        it.image(10, 10, id(album_art));
        
        // Shadow
        it.printf(
          12, 67,
          id(title_font),
          Color(0, 0, 0),
          TextAlign::TOP_LEFT,
          "%s",
          id(track_title).state.c_str()
        );
        
        // Foreground text
        it.printf(
          10, 65,
          id(title_font),
          Color(255, 255, 255),
          TextAlign::TOP_LEFT,
          "%s",
          id(track_title).state.c_str()
        );
      } else {
        //it.print(
        //  10, 65, id(title_font),
        //  Color(255, 255, 255),
        //  TextAlign::CENTER,
        //  "Nothing playing"
        //);
        it.clear();
      }

      if (id(track_artist).has_state()) {
        it.printf(
          242, 115, id(artist_font),
          Color(180, 180, 190),
          TextAlign::CENTER,
          "%s", id(track_artist).state.c_str()
        );
      }

      if (id(track_album).has_state()) {
        it.printf(
          242, 150, id(small_font),
          Color(120, 120, 135),
          TextAlign::CENTER,
          "%s", id(track_album).state.c_str()
        );
      }
  
# Album artwork streamed by Sendspin
image:
  - platform: sendspin
    id: album_slot
    format: JPEG
    type: RGB565
    resize: 200x200
    current_image:
      id: album_art
    on_image_display:
      then:
        - component.update: music_display
    on_image_clear:
      then:
        - component.update: music_display


# Track metadata
text_sensor:
  - platform: sendspin
    name: "Track Title"
    id: track_title
    type: title
    on_value:
      then:
        - component.update: music_display

  - platform: sendspin
    name: "Track Artist"
    id: track_artist
    type: artist
    on_value:
      then:
        - component.update: music_display

  - platform: sendspin
    name: "Track Album"
    id: track_album
    type: album
    on_value:
      then:
        - component.update: music_display

binary_sensor:
  - platform: gpio
    id: music_button
    name: "Music Play Button"
    internal: true
    pin:
      number: ${BTN_01}
      mode:
        input: true
        pullup: true
      inverted: true

    on_multi_click:
      # Short press: play/pause
      - timing:
          - ON for at most 500ms
          - OFF for at least 50ms
        then:
          - media_player.toggle: external_media_player

      # Long press: stop playback and turn off display
      - timing:
          - ON for at least 1s
          - OFF for at least 50ms
        then:
          - media_player.stop: external_media_player
          - light.turn_off:
              id: display_backlight
              transition_length: 0s
  - platform: gpio
    id: music_button_next_previous
    name: "Music Next Previous Button"
    internal: true
    pin:
      number: ${BTN_02}
      mode:
        input: true
        pullup: true
      inverted: true

    on_multi_click:
      # Single click: next track
      - timing:
          - ON for at most 500ms
          - OFF for at least 50ms
        then:
          - media_player.next: external_media_player

      # Long press: previous track
      - timing:
          - ON for at least 1s
          - OFF for at least 50ms
        then:
          - media_player.previous: external_media_player
          - media_player.previous: external_media_player

switch:
  - platform: template
    id: power_control
    name: "Power"
    icon: "mdi:power"
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - media_player.turn_on: external_media_player
      - light.turn_on:
          id: display_backlight
          brightness: 100%
    turn_off_action:
      - light.turn_off: display_backlight
      - media_player.turn_off: external_media_player

  - platform: template
    id: mute_control
    name: "Mute"
    icon: "mdi:volume-off"
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - media_player.mute: external_media_player
    turn_off_action:
      - media_player.unmute: external_media_player
