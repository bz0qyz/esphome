esphome:
  on_boot:
    - priority: -100.0
      then:
        - select.set:
            id: dac_output_select
            option: "BOTH"
i2c:
  id: main_i2c_bus
  sda: ${pin_i2c_sda}
  scl: ${pin_i2c_scl}
  frequency: 100kHz

audio_dac:
  - platform: es8388
    id: es8388_dac
    i2c_id: main_i2c_bus
    
i2s_audio:
  - id: !extend i2s_out
    i2s_mclk_pin: ${pin_i2s_mclk}

microphone:
  - platform: i2s_audio
    id: i2smic
    i2s_din_pin: ${pin_i2s_din}
    adc_type: external
    pdm: false
    sample_rate: 16000
    bits_per_sample: 16bit

speaker:
  - id: !extend i2s_audio_speaker
    audio_dac: es8388_dac
    internal: true

select:
  - platform: es8388
    es8388_id: es8388_dac
    dac_output:
      id: dac_output_select
      name: "DAC Output"
    adc_input_mic:
      id: dac_input_select
      name: "ADC Input MIC"
    