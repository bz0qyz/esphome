substitutions:
  devicename: "door-sensor-2"
  friendly_devicename: "Door Sensor 2"
  pin_light: GPIO15
  pin_batv: GPIO0
  pin_swtch: GPIO2

globals:
  - id: battery_charge_threshold
    type: float
    restore_value: False
    initial_value: "4.12"
  - id: voltage_multiplier
    type: float
    restore_value: False
    initial_value: "2.0"

esphome:
  name: ${devicename}
  friendly_name: ${friendly_devicename}
  area: Office
  on_boot:
    - priority: 600
      then:
        - light.turn_on:
            id: user_led
            effect: "Fast Flash"
    - priority: -100
      then:
        - logger.log:
            format: "Startup Complete"
            level: INFO
        - light.turn_off:
            id: user_led

esp32:
  #board: esp32-c6-devkitc-1
  board: seeed_xiao_esp32c6
  variant: ESP32C6
  framework:
    type: esp-idf

logger:
  level: DEBUG
  baud_rate: 0
  hardware_uart: USB_SERIAL_JTAG

# Enable Home Assistant API
api:
  encryption:
    key: !secret encryption_key

  on_client_connected:
    then:
      - wait_until:
          condition:
            lambda: "return esp_sleep_get_wakeup_cause() >= ESP_SLEEP_WAKEUP_UNDEFINED;"
          timeout: 3s
      - if:
          condition:
            lambda: "return esp_sleep_get_wakeup_cause() >= ESP_SLEEP_WAKEUP_EXT0;"
          then:
            - binary_sensor.template.publish:
                id: door_switch
                state: true
            - delay: 2.0s
      - component.update: battery_voltage_raw
      - binary_sensor.template.publish:
          id: door_switch
          state: !lambda "return id(door_switch_raw).state;"

ota:
  - platform: esphome
    password: !secret ota_password

network:
   enable_ipv6: true
 
openthread:
  tlv: !secret thread_tlv

deep_sleep:
  id: deep_sleep_control
  run_duration:
    default:
      seconds: 30
    gpio_wakeup_reason:
      seconds: 15
  sleep_duration: 60min
  wakeup_pin_mode: INVERT_WAKEUP
  esp32_ext1_wakeup:
    pins:
      - number: ${pin_swtch}
        mode:
          input: true
          pullup: true
        allow_other_uses: true
    mode: ANY_HIGH


button:
  - platform: restart
    id: restart_button
    name: Restart
    entity_category: "DIAGNOSTIC"

output:
  - platform: gpio
    id: "light_status_output"
    pin: ${pin_light}
    inverted: true

light:
  - platform: binary
    id: user_led
    name: "User Light"
    output: light_status_output
    effects:
      - strobe:
          name: "Fast Flash"
          colors:
            - state: true
              duration: 250ms
            - state: false
              duration: 250ms

binary_sensor:
  - platform: gpio
    id: door_switch_raw
    internal: True
    device_class: door
    pin:
      number: ${pin_swtch}
      mode:
        input: true
        pullup: true
      allow_other_uses: true
      inverted: false # LOW = door open (switch closed to GND)
    filters:
      - delayed_off: 500ms
    on_press:
      then: 
        - logger.log:
            format: "[DOOR] Opened"
            level: INFO
        - binary_sensor.template.publish:
            id: door_switch
            state: true
    on_release:
      then:
        - logger.log:
            format: "[DOOR] Closed"
            level: INFO
        - binary_sensor.template.publish:
            id: door_switch
            state: false
  
  - platform: template
    id: door_switch
    name: "Door"
    device_class: door
    lambda: "return id(door_switch_raw).state;"

  - platform: template
    id: usb_connected
    name: "USB Connected"
    entity_category: diagnostic
    device_class: plug
    lambda: |-
      // Read USB_SERIAL_JTAG EP1_CONF_REG directly (ESP32-C6 base: 0x6000F000)
      // Bit 1 = SERIAL_IN_EP_DATA_FREE: 1 when USB host is connected
      uint32_t ep1_conf = *(volatile uint32_t*)(0x6000F000 + 0x04);
      return (ep1_conf >> 1) & 0x1;
    on_press:
      - logger.log:
          format: "[USB] Preventing deep sleep"
          level: INFO
    on_release:
      - logger.log:
          format: "[USB] Allowing Deep Sleep"
          level: INFO
  
  - platform: template
    id: battery_charging
    name: "Battery Charging"
    entity_category: diagnostic
    device_class: battery_charging
    lambda: |-
      // If USB connected sensor is true (from Option 1), use that.
      // Otherwise, infer: voltage above 4.05V while connected suggests charging.
      return id(battery_voltage).state > id(battery_charge_threshold);

interval:
  - interval: 5s
    then:
      - if:
          condition:
            lambda: |-
              if (id(usb_connected).state) return false;
              if (id(battery_charging)) return false;
              return true;
          then:
            - logger.log:
                format: "Allowing Deep Sleep"
                level: INFO
            - deep_sleep.allow: deep_sleep_control
          else:
            - logger.log:
                format: "Preventing Deep Sleep"
                level: INFO
            - deep_sleep.prevent: deep_sleep_control
 
sensor:
  - platform: adc
    pin:
      number: ${pin_batv}
    id: battery_voltage_raw
    name: "Battery Voltage Raw"
    entity_category: diagnostic
    update_interval: 5s
    attenuation: 12db
    samples: 16
    unit_of_measurement: "V"
    accuracy_decimals: 3
    on_value:
      then:
        - sensor.template.publish:
            id: battery_voltage
            state: !lambda "return x * id(voltage_multiplier);"
        - component.update: battery_level

  - platform: template
    name: "Battery Voltage"
    id: battery_voltage
    icon: "mdi:sine-wave"
    entity_category: diagnostic
    unit_of_measurement: "V"
    accuracy_decimals: 3

  - platform: template
    name: "Battery Level"
    id: battery_level
    entity_category: diagnostic
    icon: "mdi:battery"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: never
    lambda: |-
      float v = id(battery_voltage).state;
      // Li-ion: ~4.2V full, ~3.3V empty
      float pct = (v - 3.3) / (4.2 - 3.3) * 100.0;
      if (pct > 100) return 100;
      if (pct < 0) return 0;
      return pct;

  - platform: template
    id: wakeup_cause
    name: "Wakeup Cause"
    entity_category: diagnostic
    accuracy_decimals: 0
    lambda: return esp_sleep_get_wakeup_cause();

  - platform: uptime
    id: uptime_sensor
    name: Uptime
    entity_category: "DIAGNOSTIC"
    unit_of_measurement: s
    update_interval: 10s
  
  - platform: internal_temperature
    id: cpu_temperature_sensor
    name: "CPU Temperature"
    entity_category: "DIAGNOSTIC"

  